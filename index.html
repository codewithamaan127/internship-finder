<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internship Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Internship Board</h1>
        <p>Find your dream internship</p>
    </header>

    <main>

        <section class="search-section">

            <h2>Explore Internships</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search internships..."
                aria-label="Search internships"
            >

            <select id="domainFilter" aria-label="Filter by domain">
                <option value="all">All Domains</option>
                <option value="Web Development">Web Development</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Data Science">Data Science</option>
            </select>

        </section>

        <section id="internshipList" aria-label="Internship listings">

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
